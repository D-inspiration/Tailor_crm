<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Login</title>
    <link rel="stylesheet" href="{{ url_for('comm_dashboard.static', filename='css/dashboard.css') }}">
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: #1e293b; padding: 40px; border-radius: 12px; border: 1px solid #334155; width: 320px; }
        .login-box h2 { margin-bottom: 20px; color: #f8fafc; }
        .login-box input { width: 100%; padding: 10px; margin-bottom: 12px; background: #0f172a; border: 1px solid #475569; color: #e2e8f0; border-radius: 6px; }
        .login-box button { width: 100%; padding: 10px; background: #3b82f6; border: none; color: white; border-radius: 6px; cursor: pointer; }
        .login-box button:hover { background: #2563eb; }
        .error { color: #ef4444; margin-bottom: 12px; font-size: 14px; }
        .hint { color: #64748b; font-size: 12px; margin-top: 12px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>🔐 Dashboard Login</h2>
        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}
        <form method="post">
            <input type="password" name="password" placeholder="Dashboard password">
            <input type="text" name="api_key" placeholder="Or API key">
            <button type="submit">Access Dashboard</button>
        </form>
        <p class="hint">If you are already logged into the main app, this should auto-redirect.</p>
    </div>
</body>
</html>
