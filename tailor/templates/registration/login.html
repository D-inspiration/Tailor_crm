{% extends 'base.html' %}

{% block content %}
<div class="login-page" style="display: flex; align-items: center; justify-content: center; min-height: 80vh;">
    <div class="card" style="width: 100%; max-width: 420px; padding: var(--space-2xl);">
        <div style="text-align: center; margin-bottom: var(--space-xl);">
            <div style="font-size: 3rem; margin-bottom: var(--space-md);">✂️</div>
            <h1 style="font-size: var(--text-2xl); font-weight: 800; margin-bottom: var(--space-xs);">Tailor CRM</h1>
            <p style="color: var(--color-text-secondary);">Sign in to your account</p>
        </div>

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}

            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter password" required>
            </div>

            {% if form.errors %}
            <div class="alert alert-error" style="margin-bottom: var(--space-lg);">
                Invalid username or password. Please try again.
            </div>
            {% endif %}

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: var(--space-md);">
                Sign In
            </button>
        </form>

        <div style="text-align: center; margin-top: var(--space-lg); font-size: var(--text-sm); color: var(--color-text-muted);">
            <p>Default login: <code>admin</code> / <code>admin123</code></p>
            <p style="margin-top: var(--space-sm);">Run: <code>python manage.py createsuperuser</code></p>
        </div>
    </div>
</div>
{% endblock %}
